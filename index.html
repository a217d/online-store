<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROYAL LEGEND | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/متجر الكتروني.css">
</head>
<body>

    <nav class="navbar">
        <!-- نفس الـ Navbar -->
    </nav>

    <section class="auth-section">
        <div class="auth-container">

            <!-- تسجيل الدخول -->
            <div class="auth-box" id="login-box">
                <div class="auth-logo">ROYAL <span>LEGEND</span></div>
                <h2>مرحباً بعودتك</h2>
                <p>سجّل دخولك للوصول إلى حسابك</p>

                <form class="auth-form">
                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> تذكرني
                        </label>
                        <a href="#" class="forgot-password">نسيت كلمة المرور؟</a>
                    </div>
                    <button type="submit" class="btn-auth">تسجيل الدخول</button>
                </form>

                <div class="auth-divider">
                    <span>أو</span>
                </div>

                <button class="btn-google">
                    التسجيل بحساب Google
                </button>

                <p class="auth-switch">
                    ليس لديك حساب؟ 
                    <a href="#" onclick="toggleAuth()">إنشاء حساب جديد</a>
                </p>
            </div>

            <!-- إنشاء حساب جديد -->
            <div class="auth-box hidden" id="register-box">
                <div class="auth-logo">ROYAL <span>LEGEND</span></div>
                <h2>انضم إلينا</h2>
                <p>أنشئ حسابك واستمتع بعالم الفخامة</p>

                <form class="auth-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>الاسم الأول</label>
                            <input type="text" placeholder="محمد" required>
                        </div>
                        <div class="form-group">
                            <label>الاسم الأخير</label>
                            <input type="text" placeholder="الراشد" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>رقم الجوال</label>
                        <input type="tel" placeholder="+966 5X XXX XXXX" required>
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" placeholder="8 أحرف على الأقل" required>
                    </div>
                    <div class="form-group">
                        <label>تأكيد كلمة المرور</label>
                        <input type="password" placeholder="أعد كتابة كلمة المرور" required>
                    </div>
                    <button type="submit" class="btn-auth">إنشاء الحساب</button>
                </form>

                <p class="auth-switch">
                    لديك حساب؟ 
                    <a href="#" onclick="toggleAuth()">تسجيل الدخول</a>
                </p>
            </div>

        </div>
    </section>

    <script>
        function toggleAuth() {
            document.getElementById('login-box').classList.toggle('hidden');
            document.getElementById('register-box').classList.toggle('hidden');
        }
    </script>
    <script src="../js/متجر الكتروني.js"></script>
</body>
</html>
