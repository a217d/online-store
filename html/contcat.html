<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROYAL LEGEND | اتصل بنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/متجر الكتروني.css">
</head>
<body>

    <nav class="navbar">
        <!-- نفس الـ Navbar -->
    </nav>

    <section class="page-hero">
        <h1>اتصل بنا</h1>
        <p>نسعد بتواصلك معنا</p>
    </section>

    <section class="contact-section">
        <div class="contact-wrapper">

            <!-- معلومات التواصل -->
            <div class="contact-info">
                <h2>تواصل معنا</h2>
                <p>فريقنا جاهز لخدمتك والإجابة على جميع استفساراتك</p>

                <div class="info-item">
                    <span class="info-icon">📍</span>
                    <div>
                        <h4>العنوان</h4>
                        <p>الرياض، المملكة العربية السعودية</p>
                    </div>
                </div>

                <div class="info-item">
                    <span class="info-icon">📞</span>
                    <div>
                        <h4>الهاتف</h4>
                        <p dir="ltr">+966 55 000 0000</p>
                    </div>
                </div>

                <div class="info-item">
                    <span class="info-icon">✉️</span>
                    <div>
                        <h4>البريد الإلكتروني</h4>
                        <p>info@royallegend.com</p>
                    </div>
                </div>

                <div class="info-item">
                    <span class="info-icon">🕐</span>
                    <div>
                        <h4>ساعات العمل</h4>
                        <p>السبت - الخميس: 10 صباحاً - 10 مساءً</p>
                    </div>
                </div>
            </div>

            <!-- فورم التواصل -->
            <form class="contact-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>الاسم الكامل</label>
                        <input type="text" placeholder="أدخل اسمك" required>
                    </div>
                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" placeholder="example@email.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>الموضوع</label>
                    <select>
                        <option value="">اختر الموضوع</option>
                        <option>استفسار عن منتج</option>
                        <option>طلب خاص</option>
                        <option>شكوى</option>
                        <option>اقتراح</option>
                        <option>أخرى</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الرسالة</label>
                    <textarea rows="5" placeholder="اكتب رسالتك هنا..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">إرسال الرسالة</button>
            </form>

        </div>
    </section>

    <footer class="footer">
        <!-- نفس الفوتر -->
    </footer>

    <script src="../js/متجر الكتروني.js"></script>
</body>
</html>
